schema_version: 1
id: cnsa-2.0
version: 0.1.0
name: CNSA 2.0 mapping (framework overlay)
description: >
  Framework overlay that maps kvcbom's finding types onto the NSA Commercial National
  Security Algorithm Suite 2.0. It performs no classification of its own — run it with
  --framework alongside a classifier such as baseline-pqc. The CNSA 2.0 requirement
  identifiers, text, and adoption dates are TODO(source) placeholders for a human to fill
  and verify from the official advisory; the overlay is draft until that is done.
status: draft

sources:
  - id: cnsa-2-doc
    title: "NSA Commercial National Security Algorithm Suite 2.0"
    url: "TODO(source): official NSA CNSA 2.0 advisory URL"
    status: draft
    retrieved_date: "2026-10-21"

classifications: []

