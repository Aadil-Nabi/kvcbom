schema_version: 1
id: csa-qri-sg
version: 0.1.0
name: CSA Singapore Quantum Readiness mapping (framework overlay)
description: >
  Framework overlay that maps kvcbom's finding types onto the Cyber Security Agency of
  Singapore (CSA) quantum-readiness guidance. It performs no classification of its own —
  run it with --framework alongside a classifier such as baseline-pqc. Every objective and
  control slot is a TODO(source) placeholder to be filled and verified from the official
  CSA Singapore documents; the overlay is marked vendor and carries no CSA control text
  until that is done.
status: vendor

sources:
  - id: csa-sg-doc
    title: "Cyber Security Agency of Singapore — quantum-readiness guidance"
    url: "TODO(source): official CSA Singapore quantum-readiness publication URL"
    status: vendor
    retrieved_date: "2026-10-21"

classifications: []

framework:
  id: csa-qri-sg
  name: CSA Singapore quantum-readiness guidance
  mappings:
