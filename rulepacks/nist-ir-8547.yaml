id: nist-ir-8547
version: 0.1.0
name: NIST IR 8547 transition mapping (framework overlay)
description: >
  Framework overlay that maps kvcbom's finding types onto NIST IR 8547 transition
  milestones. It performs no classification of its own — run it with --framework alongside
  a classifier such as baseline-pqc. The control identifiers, requirement text, and
  deprecation/disallowance dates are TODO(source) placeholders for a human to fill and
  verify from the official document; the overlay is draft until that is done.
status: draft

