schema_version: 1
id: enisa-eu
version: 0.1.0
name: ENISA (EU) post-quantum mapping (framework overlay)
description: >
  Framework overlay that maps kvcbom's finding types onto the European Union Agency for
  Cybersecurity (ENISA) post-quantum guidance. It performs no classification of its own —
  run it with --framework alongside a classifier such as baseline-pqc. All control
  references are TODO(source) placeholders to be filled and verified from the official
  ENISA publications; the overlay is draft until that is done.
status: draft

sources:
  - id: enisa-doc
    title: "ENISA — Post-Quantum Cryptography guidance"
    url: "TODO(source): official ENISA post-quantum publication URL"
    status: draft
    retrieved_date: "2026-10-21"

classifications: []

